name: consistency
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run check
      # Official validator needs the Claude Code CLI, so it runs here, not in `mise run check`.
      # Native installer with a pinned version: https://code.claude.com/docs/en/setup#install-a-specific-version
      - name: Install Claude Code CLI (pinned)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.270
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mise run validate
        env: { DISABLE_AUTOUPDATER: "1" }
