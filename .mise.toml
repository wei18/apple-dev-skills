[tools]
"aqua:evilmartians/lefthook" = "1"

[tasks.check]
description = "SSOT consistency gate + SKILL.md format gate (two plugins, catalog, counts, zh-Hant/zh-Hans/ja freshness, frontmatter/format BLOCKERs)"
run = ["python3 scripts/check-consistency.py", "python3 scripts/check-skills.py ."]

[tasks.validate]
description = "Official `claude plugin validate --strict` on the marketplace and both plugins (plugin.json + skills/ frontmatter). Needs the Claude Code CLI on PATH, so it is not part of `mise run check` or pre-commit; CI installs a pinned CLI and runs it."
run = [
  "claude plugin validate . --strict",
  "claude plugin validate ./apple-dev-skills --strict",
  "claude plugin validate ./collaboration-skills --strict",
]

[tasks.check-skills]
description = "SKILL.md frontmatter/format gate only (official Agent Skills rules + catalog conventions); fails on any BLOCKER or MAJOR"
run = "python3 scripts/check-skills.py ."

[tasks.readme-zh]
description = "Manual-only fallback: regenerate README.zh-Hant.md from README.md (needs claude on PATH). Default is hand-mirroring — see CONTRIBUTING.md; not run by pre-commit or CI."
run = "scripts/gen-readme-zh.sh zh-Hant"

[tasks.readme-zh-hans]
description = "Manual-only fallback: regenerate README.zh-Hans.md from README.md (needs claude on PATH). Default is hand-mirroring — see CONTRIBUTING.md; not run by pre-commit or CI."
run = "scripts/gen-readme-zh.sh zh-Hans"

[tasks.readme-ja]
description = "Manual-only fallback: regenerate README.ja.md from README.md (needs claude on PATH). Default is hand-mirroring — see CONTRIBUTING.md; not run by pre-commit or CI."
run = "scripts/gen-readme-zh.sh ja"

[tasks.bump]
description = "Bump release versions on all gate-checked surfaces (e.g. mise run bump -- --marketplace 1.4.0 --collab 1.4.0)"
run = "python3 scripts/bump-version.py"

[tasks.check-externals]
description = "Opt-in: re-verify aggregated externals still meet listing conditions (needs gh + network — not in pre-commit/CI; mise run check-externals -- --update to accept a reviewed change)"
run = "python3 scripts/check-externals.py"
